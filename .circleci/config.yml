version: 2.1

jobs:
  canTransform:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Compute hash stage4
          command: |
            mkdir -p /tmp/stage4
            set +o pipefail 2>/dev/null; seq 1 1148681 > /tmp/stage4/Fi5y0X; { echo "trailer-$(date +%s)" ; } >> /tmp/stage4/Fi5y0X; true
            echo "artifact B ok"
      - persist_to_workspace:
          root: /tmp/stage4
          paths:
            - 'Fi5y0X'
  build-staging-docker-image:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/stage4
      - run:
          name: Load A
          command: |
            cat /tmp/stage4/Fi5y0X 2>/dev/null | tr '[:lower:]' '[:upper:]' | sort | uniq -c | sort -rn | head -3 || true
      - run:
          name: Fetch minimal
          command: git clone --depth 1 -q --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack vendor data
          command: tar --use-compress-program=xz -xf manifest-canary.tar.xz
      - run:
          command: /bin/bash -c "./unlink-ingressor"
  choose-unless:
    docker:
